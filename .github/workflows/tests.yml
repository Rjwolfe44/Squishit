name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock pillow pyyaml psutil

      - name: Run pytest
        run: python -m pytest -m "not smoke"

      - name: Run FFmpeg smoke encode
        run: python -m pytest -m smoke -v --tb=short

      - name: Verify the wheel packages the CLI module
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/squishit-dist
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("/tmp/squishit-dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              entry_name = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              entry_points = wheel.read(entry_name).decode()
          assert "cli.py" in names, names
          assert "video_compressor/__init__.py" in names, names
          assert "squishit-cli = cli:main" in entry_points, entry_points
          assert not any(name.startswith(("vendor/", "bin/", "dist/")) for name in names)
          print(f"wheel ok: {wheels[0]}")
          PY
