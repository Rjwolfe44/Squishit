[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squishit"
version = "2.0.0"
description = "Power-user desktop media compression with modern codecs, containers, and Windows integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vlad"}
]
keywords = [
    "video",
    "compression",
    "ffmpeg",
    "hevc",
    "h264",
    "vp9",
    "video-encoding",
    "desktop-app"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Video :: Encoding",
]
dependencies = [
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.3",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
    "ffmpeg-python>=0.2.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "colorlog>=6.8.0",
    "rich>=13.7.0",
    "WMI>=1.5.1; platform_system == 'Windows'",
    "winotify>=1.1.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.11.0",
    "pyinstaller>=6.0.0",
    "pytest-mock>=3.14.0",
]
hardware = [
    "pyopencl>=2024.0",
]

[project.scripts]
squishit = "video_compressor.gui.main_window:run_app"
squishit-cli = "cli:main"
video-compressor = "video_compressor.gui.main_window:run_app"
video-compressor-cli = "cli:main"

[project.gui-scripts]
squishit-gui = "video_compressor.gui.main_window:run_app"
video-compressor-gui = "video_compressor.gui.main_window:run_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_compressor*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]